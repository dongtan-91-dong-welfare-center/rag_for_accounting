name: deploy

'on':
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale Connect
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Execute Remote Deploy via Tailscale SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          tailscale ssh \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail && cd \"$DEPLOY_PATH\" && git fetch origin main && git reset --hard origin/main && ./deploy.sh && ./check.sh"
