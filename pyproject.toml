[project]
name = "rag-for-accounting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1.10",
    "streamlit>=1.56.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-ai>=0.0.1",
    "langsmith>=0.1.0",
    "psycopg[binary,pool]>=3.1.0",
    # 에이전트형 채팅 서비스(src/service) + A/B 하네스(ab_eval) — DeepAgent 전환 산출물
    "deepagents>=0.6.7",
    "langchain-openai>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # MCP 서버(src/mcp/server.py) — RAG 질의를 MCP 도구로 노출
    "fastmcp>=3.4.0",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.85.0",
    "pdf2image>=1.17.0",
    "pdfminer-six>=20260107",
    "pikepdf>=10.7.2",
    "pyhwp>=0.1b15",
]
local-embedding = [
    "sentence-transformers>=3.0.0",
]

# dev 도구는 uv dependency group으로만 설치한다. 운영 이미지는 --no-dev, 로컬 임베딩은
# --extra local-embedding 또는 --extra ingest를 명시한 환경에서만 무거운 모델/파서 스택을 설치한다.
[dependency-groups]
dev = [
    "kiwipiepy>=0.23.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: 단위 테스트 — 개별 함수 논리 검증, 외부 의존성 없음 (Phase 0: Unit)",
    "system: 시스템 통합 테스트 — 가짜 데이터 기반 예외 경로/데이터 규격 검증 (Phase 1: Fast Fail)",
    "benchmark: 비즈니스 통합 테스트 — Benchmark 정답셋 기반 답변 품질 검증 (Phase 2: Quality)",
]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
