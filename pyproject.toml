[project]
name = "rag-for-accounting"
version = "1.1.0"
description = "회계기준(K-GAAP) 조항을 근거 인용과 함께 답하는 한국어 RAG 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1.10",
    "streamlit>=1.56.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-ai>=0.0.1",
    "langsmith>=0.1.0",
    "psycopg[binary,pool]>=3.1.0",
    # 에이전트형 채팅 서비스(src/service) + A/B 하네스(ab_eval) — DeepAgent 전환 산출물
    "deepagents>=0.6.7",
    "langchain-openai>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # MCP 서버(src/mcp_server/server.py) — RAG 질의를 MCP 도구로 노출
    "fastmcp>=3.4.0",
    # 형태소 토큰화 — sparse 검색이 질의를, 색인이 본문을 같은 함수로 쪼갠다. 검색이 운영 핵심 경로라 dev 그룹이 아닌 본 의존성이다.
    "kiwipiepy>=0.23.2",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.85.0",
    "pdf2image>=1.17.0",
    "pdfminer-six>=20260107",
    "pikepdf>=10.7.2",
    "pyhwp>=0.1b15",
]
local-embedding = [
    "sentence-transformers>=3.0.0",
]
# 리랭커(CrossEncoder)와 오프라인 리랭킹 하니스가 sentence-transformers를 쓴다. 리랭커는 실측상 기본 OFF라
# 운영 이미지엔 넣지 않는다 — opt-in(USE_RERANKER=true 실험)이나 하니스 실행 때만 --extra reranker로 설치한다.
reranker = [
    "sentence-transformers>=3.0.0",
]

# dev 도구는 uv dependency group으로만 설치한다. 운영 앱 이미지는 --no-dev(슬림)로 빌드하고,
# reranker·ingest·local-embedding 등 무거운 스택은 해당 --extra를 명시한 환경에서만 설치한다.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "rank-bm25>=0.2.2",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: 단위 테스트 — 개별 함수 논리 검증, 외부 의존성 없음 (Phase 0: Unit)",
    "system: 시스템 통합 테스트 — 가짜 데이터 기반 예외 경로/데이터 규격 검증 (Phase 1: Fast Fail)",
    "benchmark: 비즈니스 통합 테스트 — Benchmark 정답셋 기반 답변 품질 검증 (Phase 2: Quality)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# 기존 고복잡도 파일에 대한 한시적 베이스라인 예외 (순환 복잡도 > 10)
# 점진적 리팩터링을 통해 본 예외 목록을 축소하고 침식도를 0.3 이하로 낮춘다.
"src/ingest/ontology/md_parser.py" = ["C901"]
"src/ingest/ontology/resolver.py" = ["C901"]
"src/ingest/ontology/review_auditor.py" = ["C901"]
"src/ingest/parse/cluster_merge.py" = ["C901"]
"src/ingest/parse/layout_config.py" = ["C901"]
"tests/utils/benchmark_metrics.py" = ["C901"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
