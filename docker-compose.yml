services:
  database:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: accounting_db
    env_file:
      - .env
    # 호스트에 포트를 여는 범위를 .env로 조정한다. 
    # 형식은 "바인딩주소:호스트포트:컨테이너포트"다.
    # 기본값 127.0.0.1(루프백: 같은 컴퓨터 안에서만 닿는 주소)로 두는 이유는, 
    # 세 서비스 중 어느 것도 바깥에서 직접 접속할 필요가 없기 때문이다. 
    # 컨테이너끼리는 compose 가상 네트워크로 통신하고,
    # 호스트에서 돌리는 적재 스크립트는 localhost로 붙는다. 
    # 0.0.0.0으로 열면 방화벽이 막아 주기 전까지 사설망의 다른 서버에서도 DB가 그대로 보인다. 
    # 값 설명은 .env.example의 같은 이름 항목에 있다.
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: accounting_embedding
    # TEI 기동 파라미터는 .env를 통해 호스트 사양에 맞게 조정할 수 있습니다.
    # - --max-batch-tokens: 웜업 및 배치 추론의 최대 토큰 상한입니다. TEI는 --auto-truncate가 비활성화된 경우
    #   배치 상한이 모델의 단일 최대 토큰(KURE-v1 기준 8192) 이상이어야 하는 기동 검증을 강제하므로 8192를 기본값으로 지정합니다.
    #   기본값 16384 대비 버퍼 할당량을 절반으로 낮추어 RAM 16GB 호스트에서도 OOM 없이 안정적으로 기동합니다.
    # - --auto-truncate 미채택: 입력을 조용히 절단하는 옵션은 적재 토큰 규약(IX-201)과 어긋나고
    #   검색 품질 저하를 숨기므로 사용하지 않습니다.
    # - --max-client-batch-size: 1회 요청당 최대 배치 크기를 제한하여 저사양 환경의 메모리 급증을 방지합니다.
    command:
      # TODO: 모델 ID 환경변수화(EMBEDDING_MODEL) 시 pgvector 차원(EMBEDDING_DIM: 1024), DDL 마이그레이션 및 토크나이저 정합성 영향도를 함께 검토하여 연계 분리 필요
      - --model-id
      - nlpai-lab/KURE-v1
      - --max-batch-tokens
      - "${TEI_MAX_BATCH_TOKENS:-8192}"
      - --max-client-batch-size
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-8}"
    ports:
      - "${EMBEDDING_BIND_ADDR:-127.0.0.1}:${EMBEDDING_HOST_PORT:-8080}:80"
    volumes:
      - tei_cache:/data
    # 웜업(amd64 네이티브 CPU에서 약 2분, arm64 에뮬레이션에서는 약 9분)이 끝나야 /health가 열린다.
    # start_period와 retries는 .env의 TEI_HEALTH_START_PERIOD, TEI_HEALTH_RETRIES로 조정할 수 있다.
    # 기본값은 180초 + 60회 x 10초로 최대 약 13분까지 대기한다.
    # 이 체크가 없으면 app이 먼저 떠서 웜업 동안 들어온 질의가 임베딩 실패(Connection refused)로 "근거 부족" 응답을 만든다.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: "${TEI_HEALTH_RETRIES:-60}"
      start_period: "${TEI_HEALTH_START_PERIOD:-180s}"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting_app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      EMBEDDING_SERVER_URL: http://embedding:80
      FRONTEND_DIST_DIR: /app/frontend/dist
      # 리랭커(bge-reranker-v2-m3, ~2.2GB)가 HF 허브에서 받는 모델을 이 경로에 캐시한다.
      # 아래 hf_cache 볼륨과 짝을 이뤄 컨테이너 재생성마다 2.2GB를 다시 받지 않게 한다.
      HF_HOME: /app/hf_cache
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_HOST_PORT:-8000}:8000"
    volumes:
      - ./data/raw_data:/app/data/raw_data:ro,z
      - hf_cache:/app/hf_cache   # 리랭커 모델 재생성 시 재다운로드 방지
    depends_on:
      database:
        condition: service_healthy
      # service_healthy: TEI 웜업 완료 후에 app을 띄운다
      # 웜업 중 질의가 임베딩 실패로 흐르는 순서 문제를 compose 수준에서 차단한다.
      embedding:
        condition: service_healthy
    # 준비성 프로브: DB와 임베딩 서버에 실제로 닿을 때만 healthy가 된다(/health는 라이브니스라 의존성을 보지 않는다).
    # slim 이미지에는 curl이 없으므로 파이썬 표준 라이브러리로 호출한다. 응답이 503이면 urlopen이 예외를 던져 비정상 종료한다.
    # podman-compose 1.0.6은 CMD 배열을 작은따옴표로 감싼 CMD-SHELL 문자열로 변환하므로 인용이 깨지지 않도록 CMD-SHELL을 쓰고 작은따옴표를 쓰지 않는다. (#426)
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request as u; u.urlopen(\"http://localhost:8000/ready\", timeout=5)"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
  tei_cache:
  hf_cache:
