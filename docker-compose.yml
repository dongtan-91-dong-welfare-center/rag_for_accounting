services:
  database:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: accounting_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accounting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounting_password}
      POSTGRES_DB: ${POSTGRES_DB:-accounting_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: accounting_embedding
    # --max-batch-tokens: 웜업·배치 추론의 토큰 상한. 기본값(16384)은 기동 웜업에서 그 크기의
    # 더미 배치를 돌려 CPU(amd64 에뮬레이션) 환경에서 OOM으로 죽는다(exit 137 실측).
    # 모델 최대 입력 길이(8192)보다 낮추려면 --auto-truncate(조용한 절단)가 필요한데, 그러면
    # 적재 쪽 토큰 상한 규약(IX-201, 8192)과 어긋나므로 절단 없이 8192로만 낮춘다.
    # 질의 임베딩은 1건씩이라 서빙 성능에는 영향이 없다.
    command: ["--model-id", "nlpai-lab/KURE-v1", "--max-batch-tokens", "8192"]
    ports:
      - "8080:80"
    volumes:
      - tei_cache:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting_app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-accounting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounting_password}
      POSTGRES_DB: ${POSTGRES_DB:-accounting_db}
      EMBEDDING_SERVER_URL: http://embedding:80
      FRONTEND_DIST_DIR: /app/frontend/dist
      # 리랭커(bge-reranker-v2-m3, ~2.2GB)가 HF 허브에서 받는 모델을 이 경로에 캐시한다.
      # 아래 hf_cache 볼륨과 짝을 이뤄 컨테이너 재생성마다 2.2GB를 다시 받지 않게 한다.
      HF_HOME: /app/hf_cache
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - hf_cache:/app/hf_cache   # 리랭커 모델 재생성 시 재다운로드 방지
    depends_on:
      database:
        condition: service_healthy
      embedding:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  tei_cache:
  hf_cache:
